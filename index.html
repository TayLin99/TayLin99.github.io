<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TayLin 的玩具箱</title>
<style>
/* ===== Reset & Base ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1a2e;--surface:#16213e;--card:#0f3460;--accent:#e94560;
  --text:#eaeaea;--text2:#a0a0b8;--radius:14px;--transition:0.2s ease;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  background-image:
    radial-gradient(1200px 600px at 50% -10%, rgba(233,69,96,0.12), transparent 60%),
    radial-gradient(800px 500px at 85% 110%, rgba(15,52,96,0.6), transparent 60%);
}

/* ===== Header ===== */
.site-header{
  text-align:center;padding:56px 20px 28px;
}
.site-header .logo{
  font-size:34px;font-weight:800;
  background:linear-gradient(135deg,#e94560,#ff6b6b);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:1px;
}
.site-header .sub{
  margin-top:10px;font-size:14px;color:var(--text2);letter-spacing:2px;
}

/* ===== Grid ===== */
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:18px;max-width:900px;margin:0 auto;padding:12px 20px 60px;
}

/* ===== Card ===== */
.card{
  position:relative;display:flex;flex-direction:column;gap:10px;
  background:var(--surface);border:1px solid rgba(255,255,255,0.06);
  border-radius:var(--radius);padding:22px 20px;min-height:150px;
  overflow:hidden;transition:all var(--transition);
}
a.card{text-decoration:none;color:var(--text);}
a.card:hover{
  transform:translateY(-4px);border-color:var(--accent);
  box-shadow:0 10px 30px rgba(0,0,0,0.4),0 0 0 1px rgba(233,69,96,0.3);
}
.card .icon{
  font-size:32px;line-height:1;
}
.card .name{
  font-size:17px;font-weight:700;
}
.card .desc{
  font-size:13px;color:var(--text2);line-height:1.5;
}
.card .arrow{
  position:absolute;right:16px;top:16px;color:var(--text2);
  font-size:16px;transition:transform var(--transition);
}
a.card:hover .arrow{transform:translateX(4px);color:var(--accent);}

/* Coming soon card */
.card.soon{opacity:0.55;cursor:default;pointer-events:none;filter:grayscale(0.4);}
.card .badge{
  position:absolute;right:14px;bottom:14px;
  font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;
  background:var(--card);color:var(--text2);
}
.card.soon .badge{background:rgba(255,255,255,0.08);}

/* ===== Footer ===== */
.footer{
  text-align:center;font-size:12px;color:var(--text2);
  padding:0 20px 40px;letter-spacing:1px;
}

@media(max-width:480px){
  .site-header{padding:44px 16px 22px;}
  .site-header .logo{font-size:27px;}
  .grid{grid-template-columns:1fr;padding:8px 16px 48px;}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="logo">✦ TayLin 的玩具箱</div>
  <div class="sub">小游戏 · 小工具合集</div>
</header>

<main class="grid" id="grid"></main>

<footer class="footer">持续更新中 · 更多玩具敬请期待</footer>

<script>
// ===== 模块列表 =====
// 新增模块只需在这里加一行：
//   { icon:'🎯', name:'模块名', desc:'一句话说明', path:'模块目录/', status:'active' }
// status: 'active' 可点击进入；'soon' 显示为「即将上线」占位。
const MODULES = [
  { icon:'🧸', name:'捏捏Doll', desc:'织布娃娃换装：自由搭配部位、拖拽缩放、导出图片', path:'doll/', status:'active' },
  { icon:'🎨', name:'拼豆图纸转换', desc:'把图片转成拼豆图纸', status:'soon' },
  { icon:'🐶', name:'大狗叫小游戏', desc:'点一下，大狗叫一声', status:'soon' }
];

const grid = document.getElementById('grid');

MODULES.forEach(m => {
  const soon = m.status === 'soon';

  const card = document.createElement(soon ? 'div' : 'a');
  card.className = 'card' + (soon ? ' soon' : '');
  if (!soon) {
    card.href = m.path;
    card.innerHTML =
      '<span class="icon">' + m.icon + '</span>' +
      '<span class="name">' + m.name + '</span>' +
      '<span class="desc">' + m.desc + '</span>' +
      '<span class="arrow">→</span>';
  } else {
    card.innerHTML =
      '<span class="icon">' + m.icon + '</span>' +
      '<span class="name">' + m.name + '</span>' +
      '<span class="desc">' + m.desc + '</span>' +
      '<span class="badge">即将上线</span>';
  }

  grid.appendChild(card);
});
</script>
</body>
</html>
